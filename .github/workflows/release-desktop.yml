name: release desktop app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the Windows build to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows download
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        # actions-rust-lang/setup-rust-toolchain v2.0.1
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rust-src-dir: desktop/src-tauri

      - name: Install frontend dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Install pinned Modlock
        shell: pwsh
        run: ./scripts/install-modlock.ps1

      - name: Build packaged app files
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag de release inválida: $env:RELEASE_TAG" }
          $env:APP_VERSION = $Matches[1]
          $env:APP_API_URL = 'https://api.jukejoint.app'
          $env:APP_ENGINE_ORIGIN = 'https://signal.jukejoint.app'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Cadastre o secret TAURI_SIGNING_PRIVATE_KEY antes de publicar uma release.' }
          npm run build:release --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'O build do app falhou.' }

      - name: Prepare installer and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          $package = Get-ChildItem $bundle -Filter '*.nsis.zip' | Select-Object -First 1
          if (-not $installer -or -not $package) { throw "O Tauri não gerou os artefatos NSIS em $bundle." }
          $setupName = "Jukejoint-$env:RELEASE_TAG-windows-x64-setup.exe"
          $updateName = "Jukejoint-$env:RELEASE_TAG-windows-x64-update.nsis.zip"
          $setup = Join-Path $bundle $setupName
          $update = Join-Path $bundle $updateName
          $generatedSignature = "$($package.FullName).sig"
          if (-not (Test-Path $generatedSignature)) { throw "Assinatura do pacote não encontrada: $generatedSignature" }
          Move-Item $installer.FullName $setup
          Move-Item $package.FullName $update
          Move-Item $generatedSignature "$update.sig"
          $signaturePath = "$update.sig"
          $release = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json body,publishedAt | ConvertFrom-Json
          $manifest = @{
            version = $version
            notes = $release.body
            pub_date = $release.publishedAt
            platforms = @{
              'windows-x86_64-nsis' = @{
                signature = (Get-Content $signaturePath -Raw).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$updateName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $bundle 'latest.json') -Encoding utf8NoBOM

      - name: Attach installer and updater package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          gh release upload "$env:RELEASE_TAG" `
            (Join-Path $bundle "Jukejoint-$env:RELEASE_TAG-windows-x64-setup.exe") `
            (Join-Path $bundle "Jukejoint-$env:RELEASE_TAG-windows-x64-update.nsis.zip") `
            (Join-Path $bundle 'latest.json') `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Não consegui anexar os artefatos à release.' }
