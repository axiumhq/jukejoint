name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (${{ matrix.name }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dir: server
          - name: signaling
            dir: spike/signal
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Web and desktop frontend
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm run typecheck --prefix desktop

  desktop:
    name: Desktop Rust (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: x86_64-pc-windows-msvc
          rust-src-dir: desktop/src-tauri
      - run: npm ci --prefix web
      - run: npm ci --prefix desktop
      - run: npm run build:front --prefix desktop
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

  ci:
    name: CI
    if: always()
    needs: [go, frontend, desktop]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require all checks to pass
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$GO_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DESKTOP_RESULT" = success
