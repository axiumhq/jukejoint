# Builds the two server images (lobby API and signaling) and publishes them to
# GHCR, for linux/arm64 (the Raspberry Pi that hosts them) and linux/amd64.
#
# Each image is tagged with the full commit SHA and "main". The Pi never runs a
# tag: pi-infra pins image@sha256:<digest>, and the digests of every run are
# listed in its summary. On main, the last job sends both pins to infra-pi
# (jukejoint-published), which opens the reviewed pin PR.
name: images

on:
  push:
    branches: [main]
    paths:
      - server/**
      - spike/signal/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - server/**
      - spike/signal/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: server
          - name: signal
            dir: spike/signal
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - run: go vet ./...
      - run: go test ./...

  image:
    name: image ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: server
          - name: signal
            context: spike/signal
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jukejoint-${{ matrix.name }}
      # Pull requests only build: nothing is published from a branch.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action v4.7.0
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        # GHCR names must be lowercase; the owner may not be.
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # docker/build-push-action v7.4.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', steps.name.outputs.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Check the published platforms
        if: env.PUSH == 'true'
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          platforms=$(docker buildx imagetools inspect "$REF" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "platforms: $platforms"
          for want in linux/arm64 linux/amd64; do
            case " $platforms " in
              *" $want "*) ;;
              *) echo "missing $want in $REF" >&2; exit 1 ;;
            esac
          done

      - name: Summary
        if: env.PUSH == 'true'
        env:
          NAME: ${{ matrix.name }}
          REF: ${{ steps.name.outputs.image }}:${{ github.sha }}@${{ steps.build.outputs.digest }}
        run: |
          var="JUKEJOINT_$(echo "$NAME" | tr '[:lower:]' '[:upper:]')_IMAGE"
          {
            echo "### jukejoint-$NAME"
            echo
            echo "For pi-infra \`compose/versions.env\`:"
            echo
            echo '```text'
            echo "$var=$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Asks infra-pi for a reviewed pin update, exactly like the Axium image does:
  # the shared deploy/application-images PR picks up both pins, and merging it
  # deploys them. This repository never reaches the Pi itself.
  infra:
    name: request infra-pi pin update
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # docker/login-action v4.7.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve both pins
        id: pins
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          owner="${OWNER,,}"
          for name in api signal; do
            ref="ghcr.io/$owner/jukejoint-$name:$REVISION"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
            echo "$name=$ref@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Create CI token for infrastructure
        id: app
        # actions/create-github-app-token v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: axiumhq
          repositories: infra-pi

      - name: Request reviewed infrastructure image update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          API: ${{ steps.pins.outputs.api }}
          SIGNAL: ${{ steps.pins.outputs.signal }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n --arg api "$API" --arg signal "$SIGNAL" --arg revision "$REVISION" \
            '{event_type:"jukejoint-published",client_payload:{revision:$revision,updates:{JUKEJOINT_API_IMAGE:$api,JUKEJOINT_SIGNAL_IMAGE:$signal}}}' |
            curl --fail-with-body --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data @- \
              https://api.github.com/repos/axiumhq/infra-pi/dispatches
