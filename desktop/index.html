<!doctype html>
<html lang="pt-BR" data-theme="deadlock">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Instalação</title>
    <!-- Tema antes de pintar (sem piscar), igual ao web/index.html: ?theme= > salvo > Deadlock.
         Lista igual a web/src/lib/theme.ts. No app o Tauri põe o hash deste script na CSP. -->
    <script>
      (function () {
        var ids = ['deadlock', 'carmim', 'pergaminho', 'gelo', 'grafite'];
        var d = document.documentElement;
        try {
          var s = JSON.parse(localStorage.getItem('lobby.theme'));
          if (ids.indexOf(s) >= 0) d.dataset.theme = s;
        } catch (e) {}
        var m = /[?&]theme=(\w+)/.exec(location.search);
        if (m && ids.indexOf(m[1]) >= 0) d.dataset.theme = m[1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
