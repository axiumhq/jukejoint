<!doctype html>
<html lang="pt-BR" data-theme="carmim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lobby · Sala</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.3.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/roboto-serif@5.3.0/full.css">
<script>(function(){var d=document.documentElement;try{var t=JSON.parse(localStorage.getItem('lobby.theme'));if(t)d.dataset.theme=t}catch(e){}var m=location.search.match(/theme=(\w+)/);if(m)d.dataset.theme=m[1]})()</script>
<link rel="stylesheet" href="v8.css">
<style>
.main{padding-bottom:132px}
/* ---------- cabeçalho da sala ---------- */
.rh{position:relative;height:236px;border-radius:var(--r-xl);overflow:hidden;background:var(--k0);box-shadow:0 0 0 1px var(--line) inset}
.rh-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,hsl(from var(--k0) h s l / .95) 0,hsl(from var(--k0) h s l / .7) 40%,transparent 72%),linear-gradient(0deg,hsl(from var(--k0) h s l / .7),transparent 50%)}
.rh-body{position:absolute;z-index:2;left:26px;right:26px;top:18px;bottom:22px;display:flex;flex-direction:column}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 8px;border-radius:var(--r-sm);font-size:12px;font-weight:550;color:var(--tx-2);background:hsl(0 0% 0% / .35);backdrop-filter:blur(6px);transition:color var(--t-fast),background var(--t-fast)}
.back:hover{color:var(--tx);background:hsl(0 0% 0% / .55)}
.rh h1{margin:auto 0 12px;font-size:54px;text-wrap:balance;max-width:62%}
.rh-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--tx-2);font-size:12.5px}
.rh-meta i{width:3px;height:3px;border-radius:50%;background:var(--tx-3)}
.rh-meta .who{display:flex;align-items:center;gap:7px;color:var(--tx);font-weight:550}
.phase{position:absolute;z-index:2;right:18px;top:18px;width:272px;padding:12px 14px;border-radius:var(--r-lg);background:hsl(from var(--k0) h s l / .62);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 0 0 1px hsl(0 0% 100% / .07) inset}
.phase-t{display:flex;justify-content:space-between;font-size:11px;color:var(--tx-3);font-weight:550;text-transform:uppercase;letter-spacing:.06em}
.phase-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 9px}
.phase-bar i{height:3px;border-radius:3px;background:hsl(0 0% 100% / .12);transition:background var(--t-slow)}
.phase-bar i.on{background:var(--acc-tx)}
.phase-v{font-size:13px;font-weight:600}
.phase-v span{color:var(--tx-3);font-weight:450}

/* ---------- slots ---------- */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{position:relative;min-height:112px;padding:14px;border-radius:var(--r-lg);background:var(--s2);box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;gap:10px;transition:box-shadow var(--t-mid) var(--e-out),background var(--t-mid)}
.slot:hover{background:var(--s3)}
.slot.ok{box-shadow:0 0 0 1px var(--line-2) inset;background:linear-gradient(180deg,hsl(from var(--acc) h s l / .07),transparent 62%),var(--s2)}
.slot.ok::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc-tx),transparent);opacity:.8}
.slot.me{box-shadow:0 0 0 1px var(--line-2) inset,0 0 0 1px var(--tx-3)}
.slot.me.ok{box-shadow:0 0 0 1px var(--acc-tx) inset,0 12px 30px -18px hsl(0 0% 0% / .6)}
.slot.pop{animation:pop var(--t-slow) var(--e-out)}
@keyframes pop{40%{transform:scale(1.03)}}
.slot-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.slot-n{font-weight:600;font-size:13.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-3);margin-top:auto}
.slot-s .ico{width:14px;height:14px}
.slot.ok .slot-s{color:var(--acc-tx);font-weight:550}
.slot-s .ring{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.4px currentColor inset}
.slot.me:not(.ok) .slot-s{color:var(--tx);font-weight:550}
.slot.empty{align-items:center;justify-content:center;text-align:center;gap:6px;background:transparent;box-shadow:none;border:1px dashed var(--line-2);color:var(--tx-3);cursor:pointer;transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast)}
.slot.empty:hover{border-color:var(--acc-line);color:var(--acc-tx);background:var(--acc-soft)}
.slot.empty b{font-size:12.5px;font-weight:600;color:inherit}
.slot.empty small{font:500 10.5px var(--f-mono);opacity:.8}
.slot.empty .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1px currentColor inset;opacity:.8}

/* ---------- barra PRONTO ---------- */
.rbar{position:fixed;z-index:30;left:var(--gut);right:calc(var(--rail) + var(--gut));bottom:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:22px;padding:12px 12px 12px 20px;border-radius:var(--r-xl);
  background:hsl(from var(--s2) h s l / .9);backdrop-filter:blur(16px) saturate(140%);box-shadow:0 0 0 1px var(--line-2) inset,0 24px 50px -20px hsl(0 0% 0% / .8);transition:left var(--t-slow) var(--e-out),right var(--t-slow) var(--e-out)}
.cnt-big{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.cnt-big b{font:600 26px/1 var(--f-mono);letter-spacing:-.03em}
.cnt-big span{color:var(--tx-2);font-size:13px}
.cnt-big .start{color:var(--tx-3);font-size:12px}
.ticks{display:flex;gap:3px;margin-top:9px}
.ticks i{width:16px;height:3px;border-radius:3px;background:var(--s4);transition:background var(--t-mid)}
.ticks i.on{background:var(--acc-tx)}
.ticks i.th{position:relative}
.ticks i.th::after{content:"";position:absolute;right:-2.5px;top:-4px;width:1px;height:11px;background:var(--tx-2)}
.steps{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;color:var(--tx-3);font-size:12px}
.step{display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color var(--t-mid)}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--f-mono);box-shadow:0 0 0 1px var(--line-2) inset;transition:background var(--t-mid),color var(--t-mid),box-shadow var(--t-mid)}
.step.on{color:var(--tx)} .step.on .n{box-shadow:0 0 0 1.5px var(--acc-tx) inset;color:var(--acc-tx);animation:pulse 1s var(--e-out) infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 1.5px var(--acc-tx) inset,0 0 0 4px var(--acc-soft)}}
.step.done{color:var(--tx-2)} .step.done .n{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.step-sep{flex:0 1 22px;min-width:8px;height:1px;background:var(--line-2)}
.steps-hint{color:var(--tx-3);font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar-act{display:flex;gap:8px;align-items:center}
.ready{--h:50px;min-width:196px;font-size:15px;font-weight:700;letter-spacing:.08em;border-radius:var(--r-md)}
.ready.on{background:var(--s4);color:var(--acc-tx);box-shadow:0 0 0 1.5px var(--acc-tx) inset}
.ready.on:hover{background:var(--s3)}
.ready .kbd{letter-spacing:0}
.cd{font:600 26px/1 var(--f-mono);color:var(--acc-tx);letter-spacing:-.03em}

/* ---------- trilho da sala ---------- */
.rule{display:flex;align-items:center;gap:12px;padding:10px 12px;line-height:1.35;border-radius:var(--r-md);background:var(--s2);box-shadow:0 0 0 1px var(--line) inset;margin-bottom:6px;font-size:12.5px}
.rule .ri{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-tx);flex:none}
.inv-link{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 12px;border-radius:var(--r-md);background:var(--s1);box-shadow:0 0 0 1px var(--line-2) inset;margin-bottom:10px}
.inv-link code{flex:1;font:500 12px var(--f-mono);color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-i{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;color:var(--tx-2)}
.act-i b{color:var(--tx);font-weight:600}
.act-i .t{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--tx-3);white-space:nowrap}
.act-i.new{animation:arrive var(--t-slow) var(--e-out)}
@keyframes arrive{from{opacity:0;transform:translateY(-6px)}}

/* ---------- modo visitante (Ver sala) ---------- */
.visit .slot.me{display:none}

@media (max-width:1500px){ .steps .step:not(.on) .sl{display:none} }
@media (max-width:1100px){ .slots{grid-template-columns:repeat(3,minmax(0,1fr))} .phase{display:none} .rh h1{max-width:none} }
@media (max-width:960px){ .rbar{right:var(--gut)} .rh-meta .hide-md{display:none} }
@media (max-width:640px){
  .main{padding-bottom:150px}
  .rh{height:196px;margin-top:12px}
  .rh-body{left:16px;right:16px;top:12px;bottom:14px}
  .rh h1{font-size:38px;margin-bottom:8px}
  .rh-meta{gap:8px;font-size:12px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .slot{min-height:96px;padding:12px}
  .rbar{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;grid-template-columns:1fr auto;gap:10px 12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .steps-wrap{grid-column:1/-1;order:3}
  .ready{min-width:132px;--h:48px}
  .rbar-act .btn-g{display:none}
  .ticks i{width:11px}
  .cnt-big b{font-size:22px}
}
</style>
</head>
<body>
<header class="tb" id="tb"></header>
<div class="app">
  <main class="main" id="main">
    <div class="lineart" data-art></div>
    <section class="rh" id="rh">
      <div class="cover" data-wide id="roomCover"></div>
      <div class="rh-shade"></div>
      <div class="rh-body">
        <a class="back" href="home.html" id="backLink"></a>
        <h1 class="display" id="roomName"></h1>
        <div class="rh-meta" id="roomMeta"></div>
      </div>
      <div class="phase" aria-live="polite"><div class="phase-t"><span>Fase</span><span class="num" id="phaseN">2 de 4</span></div><div class="phase-bar" id="phaseBar"><i></i><i></i><i></i><i></i></div><div class="phase-v" id="phaseV"></div></div>
    </section>
    <button class="mfriends" data-act="sheet" id="mRoom"></button>

    <section class="sec" aria-labelledby="plH">
      <div class="sec-h">
        <h2 class="display two" id="plH">Na <em>sala</em></h2>
        <span class="lbl" id="plMeta"></span>
        <span class="sp"></span>
        <button class="link" id="copyInv"></button>
      </div>
      <div class="slots" id="slots"></div>
    </section>
  </main>
  <aside class="rail" id="rail" aria-label="Sala"><div id="railIn"></div></aside>
</div>

<div class="rbar" id="rbar">
  <div>
    <div class="cnt-big" aria-live="polite"><b id="rc">7</b><span id="rcT">de 10 prontos</span><span class="start hide-phone" id="rcS">· começa com 8</span></div>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="steps-wrap" id="stepsWrap"></div>
  <div class="rbar-act">
    <a class="btn btn-g" href="home.html" id="leave"></a>
    <button class="btn btn-p ready" id="readyBtn"></button>
  </div>
</div>
<div class="scrim"></div>

<script src="v8.js"></script>
<script>
/* ---------- qual sala ---------- */
const qs=new URLSearchParams(location.search);
const L=lobbyById(qs.get('l'))||lobbyById('madrugada');
const visiting=qs.get('ver')==='1';
const M=MODES[L.mode];
const FILL=['capivara.exe','Lanterneiro','Brasa','Sereno','Agulha','Ivone','Fagulha','Rapina','Quartzo','Mandacaru','Pólvora','Guará'];
let players;
if(L.id==='madrugada'){
  players=[['Ametista',1],[ME,0],['Odete',1],['Tordo',1],['capivara.exe',1],['Lanterneiro',1],['Brasa',1],['Sereno',0],['Agulha',0],['Ivone',1]];
} else {
  const names=[...new Set([L.host,...L.inside,...FILL])].filter(n=>n!==ME).slice(0,L.n);
  players=names.map((n,i)=>[n,i<names.length-2?1:0]); players.splice(1,0,[ME,0]);
}
if(visiting) players=players.filter(p=>p[0]!==ME);
const MAX=L.max, NEED=Math.ceil(MAX*2/3);
let joined=!visiting;
store.set('room', joined?{id:L.id,n:players.length}:store.get('room',null));

mountShell('sala');
$('#backLink').innerHTML=ico('back')+'Lobbies';
$('#copyInv').innerHTML=ico('link')+'Copiar convite';
$('#leave').innerHTML=ico('exit')+'Sair';

/* ---------- cabeçalho ---------- */
repaintCover($('#roomCover'),L.mode);
$('#roomName').textContent=L.name;
document.title='Lobby · '+L.name;
function renderMeta(){
  $('#roomMeta').innerHTML=`<span class="who">${av(L.host,22)}${esc(L.host)}<span class="tag line">${ico('crown')}<span class="hide-md">abriu a sala</span></span></span><i class="hide-md"></i>
  <span class="hide-md">${M.name}</span><i></i><span><span class="num">${players.length}/${MAX}</span> jogadores</span><i class="hide-md"></i><span class="hide-md">começa com <span class="num">${NEED}</span></span><i class="hide-md"></i><span class="hide-md">BR/SA · <span class="num">${L.ping} ms</span></span>`;
}
const PH=['Juntando gente','Esperando prontos','Contagem','Abrindo o jogo'];
function setPhase(i,extra=''){
  $('#phaseN').textContent=`${i+1} de 4`;
  $$('#phaseBar i').forEach((b,j)=>b.classList.toggle('on',j<=i));
  $('#phaseV').innerHTML=PH[i]+(extra?` <span>· ${extra}</span>`:'');
}

/* ---------- slots ---------- */
const readyN=()=>players.filter(p=>p[1]).length;
function slotHTML([n,ok],i){
  const me=n===ME, host=n===L.host, fr=FRIEND_NAMES.includes(n);
  const tag= me?'<span class="tag line">você</span>': host?`<span class="tag line" title="Abriu a sala">${ico('crown')}</span>`: fr?`<span class="tag soft" title="Na sua lista de amigos">${ico('users')}</span>`:'';
  const st= ok?`${ico('check')}Confirmou`: me?'<span class="ring"></span>Falta você':'<span class="ring"></span>Ainda não';
  return `<div class="slot ${ok?'ok':''} ${me?'me':''}" data-p="${esc(n)}"><div class="slot-top">${pres(n,40,ok?'on':'on')}${tag}</div><div><div class="slot-n">${esc(n)}</div><div class="slot-s">${st}</div></div></div>`;
}
function renderSlots(popName){
  let h=players.map(slotHTML).join('');
  for(let i=players.length;i<MAX;i++) h+=`<button class="slot empty" data-empty><span class="plus">${ico('plus')}</span><b>Convidar</b><small>vaga ${i+1}</small></button>`;
  $('#slots').innerHTML=h;
  if(popName){const el=$(`[data-p="${CSS.escape(popName)}"]`);el&&el.classList.add('pop')}
  $('#plMeta').textContent=`${players.length}/${MAX} · ${MAX-players.length} ${MAX-players.length===1?'vaga':'vagas'}`;
  renderMeta(); renderCount();
}
function renderCount(){
  const r=readyN(), n=players.length;
  $('#rc').textContent=r; $('#rcT').textContent=`de ${n} prontos`; $('#rcS').textContent=`· começa com ${NEED}`;
  let t=''; for(let i=0;i<n;i++) t+=`<i class="${i<r?'on':''} ${i===NEED-1?'th':''}"></i>`; $('#ticks').innerHTML=t;
}

/* ---------- etapas do handoff ---------- */
const STEPS=['Baixando o modo','Abrindo o Deadlock','Entrando no lobby','Dentro do lobby'];
function renderSteps(active=-1,done=-1,hint){
  if(active<0&&done<0){
    $('#stepsWrap').innerHTML=`<div class="steps-hint">${ico('info')}${hint||`Com ${NEED} prontos, o app abre o Deadlock e te põe na partida.`}</div>`; return;
  }
  $('#stepsWrap').innerHTML=`<div class="steps" aria-live="polite">${STEPS.map((s,i)=>`${i?'<span class="step-sep"></span>':''}<span class="step ${i<=done?'done':''} ${i===active?'on':''}"><span class="n">${i<=done?ico('check'):i+1}</span><span class="sl">${s}</span></span>`).join('')}</div>`;
}

/* ---------- PRONTO ---------- */
let me=()=>players.find(p=>p[0]===ME), cdT=null, cdV=0, handT=[], phase='wait';
function setBtn(){
  const b=$('#readyBtn'); $('#leave').style.display=(phase==='hand'||phase==='in')?'none':'';
  if(!joined){b.className='btn btn-p ready';b.innerHTML=ico('arrow')+'Entrar na sala';return}
  if(phase==='hand'||phase==='in'){b.className='btn btn-s ready';b.disabled=true;b.innerHTML=phase==='in'?ico('check')+'Na partida':'Abrindo…';return}
  b.disabled=false;
  const on=me()&&me()[1];
  b.className='btn ready '+(on?'on':'btn-p');
  b.innerHTML= on?(phase==='count'?`Cancelar <span class="kbd">F</span>`:`${ico('check')}Pronto <span class="kbd">F</span>`):`PRONTO <span class="kbd">F</span>`;
  b.setAttribute('aria-pressed',String(!!on));
}
function log(html){
  const box=$('#actLog'); if(!box) return;
  box.insertAdjacentHTML('afterbegin',`<div class="act-i new">${html}<span class="t">agora</span></div>`);
  $$('.act-i',box).slice(6).forEach(e=>e.remove());
}
function maybeCount(){
  if(readyN()>=NEED && me()&&me()[1] && phase==='wait'){
    phase='count'; cdV=5; setPhase(2,'começa em 5 s'); setBtn();
    $('#stepsWrap').innerHTML=`<div class="steps-hint"><span class="cd" id="cd">5</span><span>Começa em <span id="cdTxt">5 segundos</span>. Quem não confirmar fica de fora desta rodada.</span></div>`;
    cdT=setInterval(()=>{cdV--; if(cdV<=0){clearInterval(cdT);handoff();return}
      $('#cd').textContent=cdV;$('#cdTxt').textContent=cdV+(cdV===1?' segundo':' segundos');setPhase(2,`começa em ${cdV} s`)},1000);
    log(`${ico('play')}<span>Contagem começou</span>`);
    handT.push(setTimeout(()=>{const s=players.find(p=>!p[1]&&p[0]!==ME); if(s&&phase==='count'){s[1]=1;renderSlots(s[0]);log(`${av(s[0],18)}<span><b>${esc(s[0])}</b> confirmou</span>`)}},1500));
  }
}
function handoff(){
  phase='hand'; setBtn(); setPhase(3,'não feche o app');
  const seq=[[0,600],[1,1600],[2,1500],[3,0]];
  let t=0; renderSteps(0,-1);
  seq.forEach(([i,d],k)=>{ handT.push(setTimeout(()=>{
    renderSteps(i,i-1);
    if(i===3){renderSteps(-2,3);phase='in';setBtn();setPhase(3,'dentro');toast('Você está dentro. Bom jogo.','check');log(`${ico('pad')}<span>Partida começou</span>`)}
  },t)); t+=d; });
}
function toggleReady(){
  if(!joined){ // visitante entra
    joined=true; players.splice(1,0,[ME,0]); document.body.classList.remove('visit');
    store.set('room',{id:L.id,n:players.length}); renderSlots(ME); setBtn(); log(`${av(ME,18)}<span><b>Você</b> entrou na sala</span>`);
    const pill=$('[data-roompill]'); if(pill){pill.hidden=false;pill.href='sala.html?l='+L.id;pill.querySelector('.rp-name').textContent='Na sala · '+L.name;pill.querySelector('.num').textContent=`${players.length}/${MAX}`}
    return;
  }
  if(phase==='hand'||phase==='in') return;
  const m=me(); m[1]=m[1]?0:1;
  if(!m[1] && phase==='count'){clearInterval(cdT);handT.forEach(clearTimeout);handT=[];phase='wait';setPhase(1,`falta ${Math.max(0,NEED-readyN())}`);renderSteps();log(`${ico('x')}<span>Contagem cancelada</span>`)}
  renderSlots(m[1]?ME:null); setBtn();
  if(m[1]){log(`${av(ME,18)}<span><b>Você</b> confirmou</span>`); maybeCount()}
  if(phase==='wait') setPhase(1,`falta ${Math.max(0,NEED-readyN())}`);
}
$('#readyBtn').onclick=toggleReady;
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey&&!/input|textarea/i.test(e.target.tagName)){e.preventDefault();toggleReady()}});
$('#leave').onclick=e=>{store.set('room',null)};
$('#copyInv').onclick=()=>{toast('Link do convite copiado.','link')};
document.addEventListener('click',e=>{ if(e.target.closest('[data-empty]')){ if(innerWidth<=1280) document.documentElement.classList.add('sheet-open'); else $('#invTitle')?.scrollIntoView({behavior:'smooth',block:'center'}) } });
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="quick"]'); if(a){e.preventDefault(); toast('Você já está numa sala. Saia para procurar outra.','info')}});

/* ---------- trilho ---------- */
const ruleIco=['swords','shrink','dice'];
const slug=L.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
$('#railIn').innerHTML=`
  <div class="rail-sec">
    <div class="rail-h"><span class="cap">Regras do modo</span><span class="lbl">${M.name}</span></div>
    ${M.rules.map((r,i)=>`<div class="rule"><span class="ri">${ico(['swords','shrink','dice'][i]||'info')}</span><span>${esc(r)}</span></div>`).join('')}
  </div>
  <div class="rail-sec" id="invTitle">
    <div class="rail-h"><span class="cap">Convidar amigos</span><span class="lbl" id="vagasLbl">${MAX-players.length} vagas</span></div>
    <div class="inv-link"><code>lobby.gg/s/${slug}</code><button class="btn btn-s btn-sm" data-copy>${ico('copy')}Copiar</button></div>
    ${FRIENDS.filter(f=>!players.some(p=>p[0]===f.name)).map(f=>friendRow(f,'Convidar')).join('')}
  </div>
  <div class="rail-sec">
    <div class="rail-h"><span class="cap">Na sala agora</span></div>
    <div id="actLog">
      ${joined?`<div class="act-i">${av(ME,20)}<span><b>Você</b> entrou na sala</span><span class="t">agora</span></div>`:''}
      <div class="act-i">${av('Ivone',20)}<span><b>Ivone</b> entrou na sala</span><span class="t">1 min</span></div>
      <div class="act-i">${av('Tordo',20)}<span><b>Tordo</b> confirmou</span><span class="t">52 s</span></div>
      <div class="act-i">${av('Odete',20)}<span><b>Odete</b> confirmou</span><span class="t">40 s</span></div>
    </div>
  </div>`;
document.addEventListener('click',e=>{if(e.target.closest('[data-copy]'))toast('Link do convite copiado.','link')});
$('#mRoom').innerHTML=`<span class="ri" style="width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-tx)">${ico('users')}</span><span class="t"><b>Regras, convites e atividade</b><span>${M.rules.length} regras · ${MAX-players.length} vagas para chamar</span></span>${ico('chev')}`;


if(visiting) document.body.classList.add('visit');
renderSlots(); renderSteps(); setBtn(); setPhase(1,`falta ${Math.max(0,NEED-readyN())}`);
</script>
</body>
</html>
