<!doctype html>
<html lang="pt-BR" data-theme="deadlock">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- O --bg do Deadlock até o app ler o token do tema ativo (state/theme.tsx). -->
    <meta name="theme-color" content="#0a0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Modos personalizados da comunidade para Deadlock. Projeto independente, não afiliado à Valve." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jukejoint</title>
    <!-- Tema antes de pintar (sem piscar): ?theme= (capturas) > salvo > Deadlock. Lista igual a src/lib/theme.ts. -->
    <script>
      (function () {
        var ids = ['deadlock', 'carmim', 'pergaminho', 'gelo', 'grafite'];
        var d = document.documentElement;
        try {
          var s = JSON.parse(localStorage.getItem('lobby.theme'));
          if (ids.indexOf(s) >= 0) d.dataset.theme = s;
        } catch (e) {}
        var m = /[?&]theme=(\w+)/.exec(location.search);
        if (m && ids.indexOf(m[1]) >= 0) d.dataset.theme = m[1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
